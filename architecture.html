<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow">
<title>CDF Architecture — GSX Platform Demo Booth</title>
<style>
  @font-face {
    font-family: "Inter";
    src: url("Assets/fonts/InterVariable.woff2") format("woff2");
    font-weight: 100 900;
    font-style: normal;
    font-display: swap;
  }
  * { box-sizing: border-box; font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif !important; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #041220;
    color: #e5e9f0;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 60px;
  }
  .brand-lockup { display: flex; justify-content: center; align-items: center; gap: 28px; margin-bottom: 20px; }
  .brand-lockup img { height: 28px; display: block; }
  h1 { text-align: center; font-size: clamp(22px, 3vw, 34px); margin: 4px 0 6px; font-weight: 600; }
  .subtitle { text-align: center; color: #94a3b8; font-size: 15px; margin: 0 0 28px; }
  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 24px;
    padding: 8px 16px;
    border-radius: 999px;
    border: 1px solid #2d3a52;
    background: rgba(255,255,255,0.05);
    color: #e5e9f0;
    font-size: 13px;
    font-weight: 700;
    text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .back-link:hover { background: rgba(255,255,255,0.09); border-color: #60a5fa; transform: translateY(-1px); }
  .arch-frame {
    max-width: min(1400px, 100%);
    border: 1px solid #2d3a52;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
  .arch-frame img { display: block; width: 100%; height: auto; }
</style>
</head>
<body>

  <div class="brand-lockup">
    <img src="Assets/cisco-logo-blue.png" alt="Cisco">
    <img src="Assets/splunk-logo.png" alt="Splunk">
  </div>

  <h1>CDF Architecture</h1>
  <div class="subtitle">Search and Federation Across Locations</div>

  <a class="back-link" href="index.html">&larr; Back to Platform Hub Demos</a>

  <div class="arch-frame">
    <img src="Assets/arch.png" alt="CDF Architecture — Search and Federation Across Locations">
  </div>

</body>
</html>
